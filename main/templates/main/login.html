{% extends 'main/base.html' %}

{% block title %}Вход - ShoeStore{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header text-center">
                    <h4>Вход в аккаунт</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Войти</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a href="{% url 'register' %}">Нет аккаунта? Зарегистрироваться</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-gold { background: #C5A572; color: white; border: none; }
    .btn-gold:hover { background: #8B7355; color: white; }
</style>
{% endblock %}
